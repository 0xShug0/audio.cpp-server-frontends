name: Build HIP release only

on:
  workflow_call:
    inputs:
      source_repository:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      version:
        type: string
        required: true
      platforms:
        type: string
        default: '["ubuntu-24.04", "windows-2022"]'
      model_families:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      source_repository:
        description: Audio.cpp source repository
        type: string
        required: true
        default: 0xShug0/audio.cpp
      source_sha:
        description: Audio.cpp commit, branch, or tag
        type: string
        required: true
        default: main
      version:
        description: Version used in package names
        type: string
        required: true
      platforms:
        type: string
        default: '["ubuntu-24.04", "windows-2022"]'
      model_families:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  build:
    # DevLab availability and HIP build failures must not fail the release.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ fromJSON(matrix.os == 'windows-2022' && '["self-hosted", "windows", "devlab-dispatch", "strix-halo"]' || '["self-hosted", "linux", "devlab-dispatch", "strix-halo"]') }}
    timeout-minutes: 90
    env:
      ROCM_VERSION: '10.0.0'
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      RELEASE_VERSION: ${{ inputs.version }}
      GPU_TARGETS: release
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          python -m pip install ninja patchelf
          tools="$RUNNER_TEMP/hip-release-tools"
          mkdir -p "$tools"
          curl -fL --retry 3 --max-time 120 -o "$tools/ccache.tar.xz" https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-musl-static.tar.xz
          tar -xJf "$tools/ccache.tar.xz" -C "$tools" --strip-components=1 ccache-4.13.6-linux-x86_64-musl-static/ccache
          echo "$tools" >> "$GITHUB_PATH"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: ggml-org/ccache-action@v1.2.24
        with:
          key: hip-release-${{ runner.os }}-rocm10
          max-size: 2G
          install: ${{ runner.os == 'Linux' && 'no' || 'binary' }}
      - name: Build and package deployment binaries
        run: python scripts/ci/hip-release-only/build_hip_release.py --source source --output dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hip-build-logs-${{ runner.os }}
          path: dist/logs/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: hip-release-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: conda-incubator/setup-miniconda@v3
        if: runner.os == 'Linux' && inputs.model_families != ''
        with:
          activate-environment: qwen3-tts
          python-version: '3.12'
          auto-activate-base: false
          # Linux only: there the home directory is RAM on the DevLab Strix Halo
          # runners and outlives the job, while runner.temp is on scratch and is
          # cleaned after it. Not on Windows: conda init writes the shared
          # account's PowerShell profile, and once runner.temp is cleaned that
          # profile points at a deleted install and fails every PowerShell step.
          installation-dir: ${{ runner.os == 'Linux' && format('{0}/miniconda3', runner.temp) || '' }}
          pkgs-dirs: ${{ runner.os == 'Linux' && format('{0}/conda_pkgs', runner.temp) || '' }}
      - name: Collect HIP model logs and outputs on the build runner
        if: runner.os == 'Linux' && inputs.model_families != ''
        shell: bash -el {0}
        env:
          MODEL_FAMILIES: ${{ inputs.model_families }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hip-model-rtf-$GITHUB_RUN_ID"
          mkdir -p "$root/packages" "$root/results"
          cp dist/*.tar.gz dist/SHA256SUMS "$root/packages/"
          read -r -a families <<< "$MODEL_FAMILIES"
          python scripts/ci/test_reuse_soulx_prebuilt.py --root "$root" --source-sha "$SOURCE_SHA" --models "${families[@]}" 2>&1 | tee "$root/results/collection.log"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux' && inputs.model_families != ''
        with:
          name: reuse-soulx-prebuilt-hip-rtf
          path: ${{ runner.temp }}/hip-model-rtf-${{ github.run_id }}/results/
          retention-days: 1
