name: Validate Windows request-local HTTP client test
on:
  push:
    branches: [test/issue-1300-windows]
    paths: [.github/workflows/issue-1300-windows.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build updated PR 1305 test (Debug and ASan)
        shell: pwsh
        run: |
          New-Item -ItemType Directory results | Out-Null
          $commit = 'f27c31e38072d1eea84faed55eb0c1d58980bfbc'
          "PR1305=$commit" | Set-Content results/provenance.txt
          curl.exe -fLsS "https://codeload.github.com/0xShug0/audio.cpp/tar.gz/$commit" -o source.tar.gz
          if ($LASTEXITCODE) { throw 'Source download failed' }
          New-Item -ItemType Directory source | Out-Null
          tar -xzf source.tar.gz --strip-components=1 -C source
          if ($LASTEXITCODE) { throw 'Source extraction failed' }
          cmake -S source -B build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug '-DCMAKE_C_FLAGS=/fsanitize=address /Zi' '-DCMAKE_CXX_FLAGS=/fsanitize=address /Zi' '-DCMAKE_C_FLAGS_DEBUG=/Od /Zi' '-DCMAKE_CXX_FLAGS_DEBUG=/Od /Zi' '-DCMAKE_EXE_LINKER_FLAGS_DEBUG=/DEBUG /INCREMENTAL:NO' -DAUDIOCPP_MODEL_SET=custom -DAUDIOCPP_MODELS=htdemucs -DAUDIOCPP_BUILD_NATIVE_MODEL_MANAGER=ON -DAUDIOCPP_BUILD_SERVER_FRONTENDS=OFF -DENGINE_ENABLE_OPENMP=OFF -DGGML_OPENMP=OFF -DENGINE_BUILD_EXTENDED_TESTS=ON
          if ($LASTEXITCODE) { throw 'Configure failed' }
          cmake --build build/debug --target package_manager_http_test -j 4
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Validate metadata, redirect and install behavior
        shell: pwsh
        run: |
          $env:ASAN_OPTIONS = 'halt_on_error=1:detect_leaks=0'
          & ./build/debug/bin/package_manager_http_test.exe --log *> results/package_manager_http_test.log
          $testExit = $LASTEXITCODE
          Get-Content results/package_manager_http_test.log
          if ($testExit) { throw "HTTP test failed: $testExit" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1305-http-test
          path: results/
          retention-days: 3
