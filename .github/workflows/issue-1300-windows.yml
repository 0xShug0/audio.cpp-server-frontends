name: Validate package downloads with PRs 1301 and 1305
on:
  push:
    branches: [test/issue-1300-windows]
    paths: [.github/workflows/issue-1300-windows.yml]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build exact PRs together (Debug and ASan)
        id: build
        shell: pwsh
        run: |
          New-Item -ItemType Directory results | Out-Null
          $base = 'da95c6a094b5a7655c3e735988b77e4ef5428a77'
          curl.exe -fLsS "https://codeload.github.com/0xShug0/audio.cpp/tar.gz/$base" -o source.tar.gz
          if ($LASTEXITCODE) { throw 'Source download failed' }
          New-Item -ItemType Directory source | Out-Null
          tar -xzf source.tar.gz --strip-components=1 -C source
          if ($LASTEXITCODE) { throw 'Source extraction failed' }
          $commits = @{'1301'='4cc78a758d0c259e3ab9d55c65fcfa177292ecf9'; '1305'='a85072349d9951dfd9639b1cf9f53292185e9519'}
          "base=$base" | Set-Content results/provenance.txt
          foreach ($number in '1301', '1305') {
            $commit = $commits[$number]
            curl.exe -fLsS "https://github.com/0xShug0/audio.cpp/commit/$commit.patch" -o "pr$number.patch"
            if ($LASTEXITCODE) { throw "PR $number download failed" }
            Push-Location source
            try {
              git apply --check "../pr$number.patch"
              if ($LASTEXITCODE) { throw "PR $number cannot apply cleanly" }
              git apply "../pr$number.patch"
              if ($LASTEXITCODE) { throw "PR $number application failed" }
            } finally { Pop-Location }
            "PR$number=$commit" | Add-Content results/provenance.txt
          }
          Get-FileHash source/src/framework/package_manager/xet.cpp, source/src/framework/package_manager/manager.cpp |
            Format-Table -AutoSize | Out-File results/source-hashes.txt
          cmake -S source -B build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug '-DCMAKE_C_FLAGS=/fsanitize=address /Zi' '-DCMAKE_CXX_FLAGS=/fsanitize=address /Zi' '-DCMAKE_C_FLAGS_DEBUG=/Od /Zi' '-DCMAKE_CXX_FLAGS_DEBUG=/Od /Zi' '-DCMAKE_EXE_LINKER_FLAGS_DEBUG=/DEBUG /INCREMENTAL:NO' -DAUDIOCPP_MODEL_SET=custom -DAUDIOCPP_MODELS=htdemucs -DAUDIOCPP_BUILD_NATIVE_MODEL_MANAGER=ON -DAUDIOCPP_BUILD_SERVER_FRONTENDS=OFF -DENGINE_ENABLE_OPENMP=OFF -DGGML_OPENMP=OFF -DENGINE_BUILD_TESTS=ON -DENGINE_BUILD_EXTENDED_TESTS=ON
          if ($LASTEXITCODE) { throw 'Configure failed' }
          cmake --build build/debug --target audiocpp_server package_manager_xet_test package_manager_http_test -j 4
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Run existing offline download tests
        shell: pwsh
        run: |
          $env:ASAN_OPTIONS = 'halt_on_error=1:detect_leaks=0'
          $failed = @()
          foreach ($test in 'package_manager_xet_test', 'package_manager_http_test') {
            & "build/debug/bin/$test.exe" --log *> "results/$test.log"
            if ($LASTEXITCODE) { $failed += "$test exit=$LASTEXITCODE" }
          }
          if ($failed.Count) { throw ($failed -join '; ') }
      - name: Validate real Xet and HTTP installs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $dumpFolder = (Resolve-Path results).Path
          $dumpKey = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\audiocpp_server.exe'
          New-Item -Force $dumpKey | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpFolder -Value $dumpFolder -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          $server = Get-Item build/debug/bin/audiocpp_server.exe
          $env:ASAN_OPTIONS = "halt_on_error=1:detect_leaks=0"
          if (!$server) { throw 'Built server is missing' }
          $failures = 0
          foreach ($mode in 'xet', 'xet-repeat', 'http') {
            $env:AUDIOCPP_HF_XET = if ($mode -eq 'http') { '0' } else { '1' }
            $env:AUDIOCPP_HF_XET_CONCURRENCY = if ($mode -eq 'xet-serial') { '1' } else { '16' }
            $env:AUDIOCPP_HF_XET_VERIFY = if ($mode -eq 'xet-noverify') { '0' } else { '1' }
            foreach ($package in 'htdemucs_f16', 'htdemucs_q8_0') {
              $dir = Join-Path $PWD "downloads/$mode/$package"
              New-Item -ItemType Directory -Force $dir | Out-Null
              $log = "results/$mode-$package"
              $p = Start-Process $server.FullName -ArgumentList '--ui','--ui-management','--backend','cpu','--port','18000','--models-root',"`"$dir`"",'--log' -RedirectStandardOutput "$log.stdout" -RedirectStandardError "$log.stderr" -PassThru
              try {
                $ready = $false
                for ($i=0; $i -lt 30; $i++) {
                  try { Invoke-RestMethod http://127.0.0.1:18000/health -TimeoutSec 2 | Out-Null; $ready = $true; break } catch { Start-Sleep 1 }
                }
                if (!$ready) { throw 'Server did not start' }
                Invoke-RestMethod http://127.0.0.1:18000/v1/ui/models/install -Method Post -ContentType application/json -Body (@{id=$package} | ConvertTo-Json) | Out-Null
                $job = $null
                $lastMessage = ''
                $usedXet = $false
                $fellBack = $false
                for ($i=0; $i -lt 1800; $i++) {
                  $job = (Invoke-RestMethod http://127.0.0.1:18000/v1/ui/models/install-status).data | Where-Object id -eq $package
                  if ($job -and $job.message -ne $lastMessage) {
                    $lastMessage = $job.message
                    $lastMessage | Add-Content "$log.progress"
                    if ($lastMessage -match '\(Xet\)') { $usedXet = $true }
                    if ($lastMessage -match 'Xet unavailable|using HTTP') { $fellBack = $true }
                  }
                  if ($job.state -in 'complete','completed','failed','cancelled','succeeded','done','success') { break }
                  Start-Sleep -Milliseconds 100
                }
                $job | ConvertTo-Json -Depth 5 | Set-Content "$log.json"
                "$mode $package $($job.state): $($job.message)" | Tee-Object -FilePath results/status.txt -Append
                if ($job.state -ne 'complete') { throw "Install did not complete: $($job.message)" }
                if ($mode -ne 'http' -and (!$usedXet -or $fellBack)) { throw 'Xet transport was not verified without HTTP fallback' }
                $gguf = Get-ChildItem $dir -Recurse -File -Filter '*.gguf' | Select-Object -First 1
                $expected = if ($package -eq 'htdemucs_f16') { 'f8c54ba35df95aafea7881eac214b58ec18a73cbcb6ff5a90f4b762631a286b6' } else { 'b0f532ac6e5f373aeb11fa0df73253251e133832d9c8b9942dc58f50bc5b4388' }
                if (!$gguf -or (Get-FileHash $gguf.FullName).Hash -ne $expected) { throw 'Independent checksum failed' }
                Start-Sleep 2
                $p.Refresh()
                if ($p.HasExited) { throw "Server exited after install: $($p.ExitCode)" }
              } catch {
                $failures++
                $p.Refresh()
                "$mode $package polling failed: $_; server exited=$($p.HasExited) exit=$($p.ExitCode)" | Tee-Object -FilePath results/status.txt -Append
                Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
                  Where-Object Message -Match 'audiocpp_server' | Format-List TimeCreated,Message | Out-File "$log.events"
              } finally {
                Stop-Process -Id $p.Id -ErrorAction SilentlyContinue
                $p.WaitForExit()
              }
              if (Test-Path $dir) {
                Get-ChildItem $dir -Force -Recurse -File |
                  ForEach-Object { '{0} {1} {2}' -f (Get-FileHash $_.FullName).Hash, $_.Length, $_.FullName } |
                  Tee-Object -FilePath results/hashes.txt -Append
              }
            }
          }
          if (Select-String -Path 'results/*.stderr' -Pattern 'ERROR: AddressSanitizer' -Quiet) { $failures++ }
          if ($failures) { throw "$failures validation failures" }
          $cdb = Get-Item "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue
          if ($cdb) {
            foreach ($dump in Get-ChildItem results -Filter '*.dmp') {
              & $cdb.FullName -z $dump.FullName -y "srv*https://msdl.microsoft.com/download/symbols" -c '!analyze -v; q' *> "$($dump.FullName).txt"
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1300-windows
          path: results/
          retention-days: 3
