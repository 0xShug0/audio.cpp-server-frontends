name: HIP release packages

on:
  workflow_call:
    inputs:
      source_repository:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      version:
        type: string
        required: true
      gpu_targets:
        type: string
        default: release
      platforms:
        type: string
        default: '["ubuntu-24.04", "windows-2022"]'

permissions:
  contents: read
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ fromJSON(matrix.os == 'windows-2022' && '["self-hosted", "windows", "devlab-dispatch", "strix-halo"]' || '["self-hosted", "linux", "devlab-dispatch", "strix-halo"]') }}
    timeout-minutes: 360
    env:
      ROCM_VERSION: '10.0.0'
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      RELEASE_VERSION: ${{ inputs.version }}
      GPU_TARGETS: ${{ inputs.gpu_targets }}
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-flow
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: python -m pip install ninja patchelf
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: ggml-org/ccache-action@v1.2.24
        with:
          key: hip-release-${{ runner.os }}-rocm10
          max-size: 2G
          install: binary
      - name: Build and package full deployment
        run: python release-flow/scripts/ci/build_hip_release.py --source source --output dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hip-build-logs-${{ runner.os }}
          path: dist/logs/
      - uses: actions/upload-artifact@v4
        with:
          name: hip-release-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
