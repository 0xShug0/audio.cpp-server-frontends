name: HIP release packages

on:
  workflow_call:
    inputs:
      source_repository:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      version:
        type: string
        required: true
      gpu_targets:
        type: string
        default: 'gfx90a;gfx942;gfx950;gfx1030;gfx1100;gfx1101;gfx1150;gfx1151;gfx1200;gfx1201'
      platforms:
        type: string
        default: '["ubuntu-24.04", "windows-2022"]'
      artifact_run_id:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: inputs.artifact_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      ROCM_VERSION: '10.0.0'
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      RELEASE_VERSION: ${{ inputs.version }}
      GPU_TARGETS: ${{ inputs.gpu_targets }}
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-flow
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev patchelf
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: ggml-org/ccache-action@v1.2.24
        with:
          key: hip-release-${{ runner.os }}-rocm10
          max-size: 2G
      - name: Build and package full deployment
        run: python release-flow/scripts/ci/build_hip_release.py --source source --output dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hip-build-logs-${{ runner.os }}
          path: dist/logs/
      - uses: actions/upload-artifact@v4
        with:
          name: hip-release-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
  test-inputs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage user test inputs and harness (no source checkout on AMD)
        run: |
          set -euo pipefail
          mkdir inputs
          cp scripts/ci/test_hip_release.py inputs/
          curl -fL --retry 3 --max-time 300 -o inputs/moonshine-tiny-q8_0.gguf https://huggingface.co/audio-cpp/audio.cpp-gguf/resolve/main/Moonshine-Streaming-GGUF/moonshine-streaming-tiny-q8_0.gguf
          curl -fL --retry 3 --max-time 60 -o inputs/jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
          cd inputs
          sha256sum *.gguf *.wav > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hip-user-inputs
          path: inputs/
          compression-level: 0
  user-test:
    needs: [test-inputs, build]
    if: always() && needs.test-inputs.result == 'success' && (needs.build.result == 'success' || inputs.artifact_run_id != '')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ fromJSON(matrix.os == 'windows-2022' && '["self-hosted", "windows", "devlab-dispatch", "strix-halo"]' || '["self-hosted", "linux", "devlab-dispatch", "strix-halo"]') }}
    timeout-minutes: 35
    steps:
      - name: Prepare isolated user directory
        shell: bash
        run: |
          root="$RUNNER_TEMP/hip-release-user-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$root"
          printf 'USER_TEST_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: hip-release-${{ runner.os }}
          path: ${{ env.USER_TEST_ROOT }}/packages
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: hip-user-inputs
          path: ${{ env.USER_TEST_ROOT }}/inputs
      - name: Run extracted CLI, server and C library as a user
        shell: bash
        working-directory: ${{ env.USER_TEST_ROOT }}
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p results
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} inputs/test_hip_release.py 2>&1 | tee results/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hip-user-results-${{ runner.os }}
          path: ${{ env.USER_TEST_ROOT }}/results/
