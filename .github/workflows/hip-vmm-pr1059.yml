name: HIP VMM PR 1059 A-B

on:
  push:
    branches: [hip-test]
    paths:
      - .github/workflows/hip-vmm-pr1059.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 0xShug0/audio.cpp
          ref: c8365f391307a97bfe133e0872e632fe572ecace
          path: source-base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ZeroDot1/audio.cpp
          ref: b5528d605eae00a82a6140b9358582add712c351
          path: source-head
          persist-credentials: false
      - name: Stage pinned production sources and tiny inputs
        run: |
          set -euo pipefail
          mkdir -p payload/inputs payload/results
          for variant in base head; do
            git -C "source-$variant" rev-parse HEAD > "payload/results/$variant-ref.txt"
            tar --exclude=./.git --exclude=./docs --exclude=./assets --exclude=./resources \
              --exclude=./reference --exclude=./webui --exclude=./models \
              -czf "payload/source-$variant.tar.gz" -C "source-$variant" .
          done
          curl -fL --retry 2 --max-time 180 -o payload/inputs/moonshine-tiny-q8_0.gguf \
            https://huggingface.co/audio-cpp/audio.cpp-gguf/resolve/main/Moonshine-Streaming-GGUF/moonshine-streaming-tiny-q8_0.gguf
          curl -fL --retry 2 --max-time 60 -o payload/inputs/jfk.wav \
            https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
          python3 - <<'PY'
          import wave
          with wave.open('payload/inputs/jfk.wav', 'rb') as source:
              params, frames = source.getparams(), source.readframes(source.getnframes())
          with wave.open('payload/inputs/jfk-twice.wav', 'wb') as target:
              target.setparams(params)
              target.writeframes(frames * 2)
          PY
          sha256sum payload/inputs/* > payload/results/input-sha256.txt
          du -h payload/*.tar.gz payload/inputs/*
      - uses: actions/upload-artifact@v4
        with:
          name: hip-vmm-inputs
          path: payload/
          compression-level: 0
          retention-days: 2
  hip-vmm:
    needs: prepare
    runs-on: [self-hosted, linux, devlab-dispatch, strix-halo]
    timeout-minutes: 45
    env:
      BASE_REF: c8365f391307a97bfe133e0872e632fe572ecace
      HEAD_REF: b5528d605eae00a82a6140b9358582add712c351
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hip-vmm-inputs
      - name: Extract pinned sources
        run: |
          set -euo pipefail
          for variant in base head; do
            mkdir -p "source-$variant"
            tar -xzf "source-$variant.tar.gz" -C "source-$variant"
          done
      - name: Check HIP environment
        run: |
          set -euo pipefail
          mkdir -p results
          exec > >(tee results/environment.log) 2>&1
          uname -a
          lscpu
          ls -l /dev/kfd /dev/dri
          rocm="${ROCM_PATH:-/opt/rocm}"
          if [[ ! -x "$rocm/bin/hipcc" ]] && command -v hipconfig >/dev/null; then
            rocm="$(hipconfig --path)"
          fi
          test -x "$rocm/bin/hipcc"
          "$rocm/bin/hipcc" --version
          cmake --version
          ninja --version
          echo "ROCM_PATH=$rocm" >> "$GITHUB_ENV"
          echo "$rocm/bin" >> "$GITHUB_PATH"
          echo "$rocm/llvm/bin" >> "$GITHUB_PATH"
          arch=$("$rocm/llvm/bin/amdgpu-arch" | head -1)
          [[ "$arch" =~ ^gfx[0-9a-f]+$ ]]
          echo "GPU_ARCH=$arch" >> "$GITHUB_ENV"
      - name: Build and test actual GGML pool on base and PR
        run: |
          set -euo pipefail
          ulimit -c 0
          for variant in base head; do
            source="source-$variant"
            build="$source/build/debug"
            cmake -S "$source" -B "$build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_STANDARD=17 \
              -DCMAKE_C_COMPILER="$ROCM_PATH/llvm/bin/clang" \
              -DCMAKE_CXX_COMPILER="$ROCM_PATH/llvm/bin/clang++" \
              -DCMAKE_HIP_COMPILER="$ROCM_PATH/llvm/bin/clang++" \
              -DCMAKE_PREFIX_PATH="$ROCM_PATH" -DGPU_TARGETS="$GPU_ARCH" \
              -DENGINE_ENABLE_HIP=ON -DENGINE_ENABLE_CUDA=OFF -DENGINE_ENABLE_VULKAN=OFF \
              -DENGINE_ENABLE_OPENMP=OFF -DGGML_OPENMP=OFF -DGGML_HIP_NO_VMM=OFF \
              -DENGINE_BUILD_EXAMPLES=ON -DAUDIOCPP_BUILD_NATIVE_MODEL_MANAGER=OFF \
              -DAUDIOCPP_MODEL_SET=custom -DAUDIOCPP_MODELS=moonshine_asr \
              2>&1 | tee "results/$variant-configure.log"
            cmake --build "$build" --target audiocpp_cli -j 8 2>&1 | tee "results/$variant-build.log"
            cp "$build/CMakeCache.txt" "results/$variant-CMakeCache.txt"
            for clip in jfk jfk-twice; do
              set +e
              AMD_LOG_LEVEL=4 timeout 180 "$build/bin/audiocpp_cli" --task asr --family moonshine_asr \
                --model inputs/moonshine-tiny-q8_0.gguf --backend hip --threads 4 \
                --audio "inputs/$clip.wav" --text-out "results/$variant-$clip.txt" \
                --log --metrics > "results/$variant-$clip.log" 2>&1
              rc=$?
              set -e
              echo "$rc" > "results/$variant-$clip.exit"
              tail -n 30 "results/$variant-$clip.log"
            done
          done
      - name: Check coverage, reproduction and ASR accuracy
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path('results')
          reference = 'and so my fellow americans ask not what your country can do for you ask what you can do for your country'.split()
          lines, errors = [], []
          for variant in ('base', 'head'):
              for clip, repeats in (('jfk', 1), ('jfk-twice', 2)):
                  log = (root / f'{variant}-{clip}.log').read_text(errors='replace')
                  rc = int((root / f'{variant}-{clip}.exit').read_text())
                  access_calls = [line for line in log.splitlines() if 'hipMemSetAccess' in line]
                  map_calls = [line for line in log.splitlines() if 'hipMemMap' in line]
                  vmm_enabled = 'VMM: yes' in log
                  covered = vmm_enabled and len(access_calls) > 1
                  text_path = root / f'{variant}-{clip}.txt'
                  text = text_path.read_text() if text_path.exists() else ''
                  actual = re.findall(r"[a-z]+", text.lower())
                  expected = reference * repeats
                  row = list(range(len(actual) + 1))
                  for i, a in enumerate(expected, 1):
                      following = [i]
                      for j, b in enumerate(actual, 1):
                          following.append(min(row[j]+1, following[-1]+1, row[j-1]+(a != b)))
                      row = following
                  wer = row[-1] / len(expected)
                  failure = 'hipMemSetAccess' in log and 'invalid argument' in log.lower()
                  lines.append(f'{variant}/{clip}: exit={rc}, VMM_enabled={vmm_enabled}, mapping_log_lines={len(map_calls)}, access_log_lines={len(access_calls)}, repeated_access_covered={covered}, VMM_invalid_argument={failure}, WER={wer:.3f}, transcript={text.strip()!r}')
                  if variant == 'head' and (rc != 0 or not covered or wer > 0.25):
                      errors.append(f'{clip}: PR inference/coverage/accuracy check failed')
          reproduced = any('base/' in line and 'VMM_invalid_argument=True' in line for line in lines)
          lines.append(f'Original invalid-argument failure reproduced on this host: {reproduced}')
          if not reproduced:
              lines.append('The original failure was not reproduced on this GPU/runtime; passing tests establish compatibility, not proof of reproducing the reported bug.')
          lines.extend(errors)
          report = '\n'.join(lines) + '\n'
          print(report)
          (root / 'summary.txt').write_text(report)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('```text\n' + report + '```\n')
          if errors:
              raise SystemExit(1)
          PY
      - name: Upload all evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hip-vmm-pr1059-${{ github.run_attempt }}
          path: results/
          retention-days: 7
