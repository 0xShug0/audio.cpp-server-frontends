name: Validate HIP release artifacts on AMD

on:
  workflow_dispatch:
    inputs:
      model_rtf:
        description: Measure RE-USE and SoulX from existing HIP release artifacts
        type: boolean
        default: false
      model_families:
        description: 'Models to collect, space-separated (reuse and/or soulx_flashhead)'
        type: string
        default: 'reuse soulx_flashhead'
      release_only:
        description: Build current audio.cpp release packages only, without model tests
        type: boolean
        default: false
      source_sha:
        description: 'audio.cpp commit (empty resolves current main)'
        type: string
        default: ''
      gpu_targets:
        description: 'Compiled architectures, or release for the full per-OS release list'
        type: string
        default: 'gfx1151'
      artifact_run_id:
        description: 'Retest packages from an earlier run without rebuilding (also provide source_sha)'
        type: string
        default: ''
      platforms:
        description: 'Build/test OS list (JSON): ubuntu-24.04 and/or windows-2022'
        type: string
        default: '["ubuntu-24.04", "windows-2022"]'

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          sha="$REQUESTED_SHA"
          if [[ -n "$ARTIFACT_RUN_ID" ]]; then
            [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ && -n "$sha" ]]
          fi
          if [[ -z "$sha" ]]; then
            sha=$(git ls-remote https://github.com/0xShug0/audio.cpp.git refs/heads/main | cut -f1)
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building clean audio.cpp $sha" >> "$GITHUB_STEP_SUMMARY"
  packages:
    needs: prepare
    if: inputs.artifact_run_id == '' && !inputs.release_only && !inputs.model_rtf
    uses: ./.github/workflows/release-hip.yml
    with:
      source_repository: 0xShug0/audio.cpp
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      version: validation-${{ github.run_number }}
      gpu_targets: ${{ inputs.gpu_targets || 'gfx1151' }}
      platforms: ${{ inputs.platforms || '["ubuntu-24.04", "windows-2022"]' }}
  release-only:
    needs: prepare
    if: inputs.release_only
    uses: ./.github/workflows/hip-release-only.yml
    with:
      source_repository: 0xShug0/audio.cpp
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      version: main-${{ needs.prepare.outputs.source_sha }}
      platforms: ${{ inputs.platforms }}
      model_families: ${{ inputs.model_rtf && inputs.model_families || '' }}
  test-inputs:
    if: ${{ !inputs.release_only && !inputs.model_rtf }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage user test inputs and harness (no source checkout on AMD)
        run: |
          set -euo pipefail
          mkdir inputs
          cp scripts/ci/test_hip_release.py inputs/
          curl -fL --retry 3 --max-time 300 -o inputs/moonshine-tiny-q8_0.gguf https://huggingface.co/audio-cpp/audio.cpp-gguf/resolve/main/Moonshine-Streaming-GGUF/moonshine-streaming-tiny-q8_0.gguf
          curl -fL --retry 3 --max-time 60 -o inputs/jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
          cd inputs
          sha256sum *.gguf *.wav > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hip-user-inputs
          path: inputs/
          compression-level: 0
  user-test:
    needs: [prepare, test-inputs, packages]
    if: always() && !inputs.release_only && !inputs.model_rtf && needs.prepare.result == 'success' && needs.test-inputs.result == 'success' && (needs.packages.result == 'success' || inputs.artifact_run_id != '')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ fromJSON(matrix.os == 'windows-2022' && '["self-hosted", "windows", "devlab-dispatch", "strix-halo"]' || '["self-hosted", "linux", "devlab-dispatch", "strix-halo"]') }}
    timeout-minutes: 35
    steps:
      - name: Prepare isolated user directory
        shell: bash
        run: |
          root="$RUNNER_TEMP/hip-release-user-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$root"
          printf 'USER_TEST_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: hip-release-${{ runner.os }}
          path: ${{ env.USER_TEST_ROOT }}/packages
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: hip-user-inputs
          path: ${{ env.USER_TEST_ROOT }}/inputs
      - name: Run extracted CLI, server and C library as a user
        shell: bash
        working-directory: ${{ env.USER_TEST_ROOT }}
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p results
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} inputs/test_hip_release.py 2>&1 | tee results/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hip-user-results-${{ runner.os }}
          path: ${{ env.USER_TEST_ROOT }}/results/

  model-rtf:
    needs: prepare
    if: inputs.model_rtf && !inputs.release_only
    runs-on: [self-hosted, linux, devlab-dispatch, strix-halo]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: hip-release-Linux
          path: ${{ runner.temp }}/hip-model-rtf-${{ github.run_id }}/packages
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: qwen3-tts
          python-version: '3.12'
          auto-activate-base: false
      - name: Collect prebuilt HIP logs and outputs sequentially
        shell: bash -el {0}
        env:
          PYTHONUNBUFFERED: '1'
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          MODEL_FAMILIES: ${{ inputs.model_families }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hip-model-rtf-$GITHUB_RUN_ID"
          mkdir -p "$root/results"
          read -r -a families <<< "$MODEL_FAMILIES"
          python scripts/ci/test_reuse_soulx_prebuilt.py --root "$root" --source-sha "$SOURCE_SHA" --models "${families[@]}" 2>&1 | tee "$root/results/collection.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reuse-soulx-prebuilt-hip-rtf
          path: ${{ runner.temp }}/hip-model-rtf-${{ github.run_id }}/results/
          retention-days: 1
