name: Validate HIP release artifacts on AMD

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'audio.cpp commit (empty resolves current main)'
        type: string
        default: ''
      gpu_targets:
        description: 'Compiled architectures, or release for the full per-OS release list'
        type: string
        default: 'gfx1151'
      artifact_run_id:
        description: 'Retest packages from an earlier run without rebuilding (also provide source_sha)'
        type: string
        default: ''
      platforms:
        description: 'Build/test OS list (JSON): ubuntu-24.04 and/or windows-2022'
        type: string
        default: '["ubuntu-24.04", "windows-2022"]'

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          sha="$REQUESTED_SHA"
          if [[ -n "$ARTIFACT_RUN_ID" ]]; then
            [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ && -n "$sha" ]]
          fi
          if [[ -z "$sha" ]]; then
            sha=$(git ls-remote https://github.com/0xShug0/audio.cpp.git refs/heads/main | cut -f1)
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building clean audio.cpp $sha" >> "$GITHUB_STEP_SUMMARY"
  packages:
    needs: prepare
    uses: ./.github/workflows/release-hip.yml
    with:
      source_repository: 0xShug0/audio.cpp
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      version: validation-${{ github.run_number }}
      gpu_targets: ${{ inputs.gpu_targets || 'gfx1151' }}
      platforms: ${{ inputs.platforms || '["ubuntu-24.04", "windows-2022"]' }}
      artifact_run_id: ${{ inputs.artifact_run_id || '' }}
