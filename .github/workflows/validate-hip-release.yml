name: Validate HIP release artifacts on AMD

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'audio.cpp commit (empty resolves current main)'
        type: string
        default: ''
      gpu_targets:
        description: 'Compiled architectures (use the release list for final multi-architecture validation)'
        type: string
        default: 'gfx1151'
      artifact_run_id:
        description: 'Retest packages from an earlier run without rebuilding (also provide source_sha)'
        type: string
        default: ''
      platforms:
        description: 'Build/test OS list (JSON): ubuntu-24.04 and/or windows-2022'
        type: string
        default: '["ubuntu-24.04", "windows-2022"]'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          sha="$REQUESTED_SHA"
          if [[ -n "$ARTIFACT_RUN_ID" ]]; then
            [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ && -n "$sha" ]]
          fi
          if [[ -z "$sha" ]]; then
            sha=$(git ls-remote https://github.com/0xShug0/audio.cpp.git refs/heads/main | cut -f1)
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building clean audio.cpp $sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Stage user test inputs and harness (no source checkout on AMD)
        run: |
          set -euo pipefail
          mkdir inputs
          cp scripts/ci/test_hip_release.py inputs/
          curl -fL --retry 3 --max-time 300 -o inputs/moonshine-tiny-q8_0.gguf https://huggingface.co/audio-cpp/audio.cpp-gguf/resolve/main/Moonshine-Streaming-GGUF/moonshine-streaming-tiny-q8_0.gguf
          curl -fL --retry 3 --max-time 60 -o inputs/jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
          cd inputs
          sha256sum *.gguf *.wav > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hip-user-inputs
          path: inputs/
          compression-level: 0
  packages:
    needs: prepare
    if: inputs.artifact_run_id == ''
    uses: ./.github/workflows/release-hip.yml
    with:
      source_repository: 0xShug0/audio.cpp
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      version: validation-${{ github.run_number }}
      gpu_targets: ${{ inputs.gpu_targets || 'gfx1151' }}
      platforms: ${{ inputs.platforms || '["ubuntu-24.04", "windows-2022"]' }}
  user-test:
    needs: [prepare, packages]
    if: always() && needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms || '["ubuntu-24.04", "windows-2022"]') }}
    runs-on: ${{ fromJSON(matrix.os == 'windows-2022' && '["self-hosted", "windows", "devlab-dispatch", "strix-halo"]' || '["self-hosted", "linux", "devlab-dispatch", "strix-halo"]') }}
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hip-release-${{ runner.os }}
          path: packages
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: hip-user-inputs
          path: inputs
      - name: Run extracted CLI, server and C library as a user
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p results
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} inputs/test_hip_release.py 2>&1 | tee results/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hip-user-results-${{ runner.os }}
          path: results/
