              python3 source/.github/tests/rocm_v2_campaign.py --manifest source/workload-model-campaign.json --output-dir results/models --deadline-epoch "$campaign_deadline" --log || model_status=$?
            else
              model_status=1
            fi
            if (( probe_status || model_status )); then exit 1; fi
            exit 0
          fi
          python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir results --resume --deadline-epoch "$campaign_deadline" --log
          if [[ "$VALIDATION_GROUP" == halo-final ]]; then
            python3 source/.github/tests/rocm_v2_halo.py --root results --source source --select-candidate
            python3 source/.github/tests/rocm_v2_campaign.py --manifest source/model-campaign.json --output-dir results/models --deadline-epoch "$campaign_deadline" --log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: ${{ github.workspace }}/rocm-v2-${{ github.run_id }}-${{ github.run_attempt }}/results/
          retention-days: ${{ (inputs.focus == 'yue2-vulkan' || inputs.focus == 'workload-refine' || inputs.focus == 'workload-probes' || inputs.focus == 'generic-gates' || inputs.focus == 'tts-main' || inputs.focus == 'asr-music') && 1 || 14 }}
      - uses: actions/cache/save@v4
        if: ${{ always() && env.VALIDATION_GROUP != 'yue2-vulkan' && env.VALIDATION_GROUP != 'ggml-v1' && env.VALIDATION_GROUP != 'irodori-main' && env.VALIDATION_GROUP != 'tts-main' && env.VALIDATION_GROUP != 'asr-music' && env.VALIDATION_GROUP != 'ar-gemv' && env.VALIDATION_GROUP != 'breeze-ar' && env.VALIDATION_GROUP != 'rdna-depth' && env.VALIDATION_GROUP != 'tts-profile' && env.VALIDATION_GROUP != 'tts-kernels' && env.VALIDATION_GROUP != 'rms-probes' && env.VALIDATION_GROUP != 'generic-gates' && env.VALIDATION_GROUP != 'workload-probes' && env.VALIDATION_GROUP != 'workload-refine' }}
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: rocm-v2-a5369900-gfx1151-debug-cxx17-${{ github.sha }}
