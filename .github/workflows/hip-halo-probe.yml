            python3 - <<'PYTHON'
          import hashlib, json, subprocess
          from pathlib import Path
          for record in json.loads(Path('source/inputs/model-provenance.json').read_text()):
              target = Path('source') / record['destination']
              target.parent.mkdir(parents=True, exist_ok=True)
              url = 'https://huggingface.co/{repo}/resolve/{revision}/{file}?download=true'.format(**record)
              subprocess.run(['curl', '--fail', '--location', '--connect-timeout', '20', '--max-time', '600',
                              '--retry', '2', '-o', str(target), url], check=True)
              assert target.stat().st_size == record['size'], 'model size mismatch: ' + record['family']
              if not record['sha256']:
                  data = target.read_bytes()
                  actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  assert actual == record['blob_id'], 'sidecar hash mismatch: ' + record['file']
