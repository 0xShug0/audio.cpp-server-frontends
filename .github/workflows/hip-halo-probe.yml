name: Validation
run-name: Validation

on:
  workflow_dispatch:
    inputs:
      focus:
        description: Validation group
        type: choice
        options: [complete, sgemm, precision]
        default: complete
  push:
    branches: [experiment/rocm-v2-probes]
    paths:
      - .github/workflows/hip-halo-probe.yml
      - .github/tests/rocm_v2_*
      - .github/tests/rocm-v2-*

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/tests
            tests/unittests/test_hip_halo_sgemm.cu
            tests/unittests/test_hip_halo_im2col.cu
            tests/unittests/test_hip_halo_mmvq.cu
            tests/unittests/assets/hip_halo
            external/ggml/src/ggml-hip/halo
      - name: Prepare validation inputs
        env:
          VALIDATION_GROUP: ${{ inputs.focus || 'complete' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/tests -p test_rocm_v2_campaign.py -v
          mkdir -p source/toolchain
          curl --fail --location --max-time 120 --retry 2 \
            -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-musl-static.tar.xz
          tar -xJf ccache.tar.xz --strip-components=1 -C source/toolchain \
            ccache-4.13.6-linux-x86_64-musl-static/ccache
          source/toolchain/ccache --version
          sha256sum source/toolchain/ccache > source/ccache-sha256.txt
          git init source
          git -C source remote add origin https://github.com/0xShug0/audio.cpp.git
          git -C source config core.autocrlf false
          git -C source fetch --no-tags --depth=1 --filter=blob:none origin a53699007eee6616f4bc33c0ae2b1f069dac49c0
          git -C source sparse-checkout set external/ggml external/cJSON include src/framework/core src/framework/io app/cli tests/unittests
          git -C source checkout --detach FETCH_HEAD
          git -C source rev-parse HEAD > source-commit.txt
          git -C source apply --check ../.github/tests/rocm-v2-source.patch
          git -C source apply ../.github/tests/rocm-v2-source.patch
          git -C source apply --check ../.github/tests/rocm-v2-framework.patch
          git -C source apply ../.github/tests/rocm-v2-framework.patch
          cp -a source/external/ggml source-vulkan
          cat >> source/external/ggml/CMakeLists.txt <<'CMAKE'
          set(PROBE_ROOT "${CMAKE_CURRENT_SOURCE_DIR}/../..")
          add_executable(framework_backend_probe
            ${PROBE_ROOT}/tests/unittests/test_backend_device_resolution.cpp
            ${PROBE_ROOT}/src/framework/core/backend.cpp
            ${PROBE_ROOT}/src/framework/core/module.cpp
            ${PROBE_ROOT}/src/framework/core/execution_context.cpp
            ${PROBE_ROOT}/src/framework/core/host_memory.cpp
            ${PROBE_ROOT}/src/framework/io/json.cpp
            ${PROBE_ROOT}/src/framework/io/filesystem.cpp
            ${PROBE_ROOT}/external/cJSON/cJSON.c)
          target_include_directories(framework_backend_probe PRIVATE ${PROBE_ROOT}/include ${PROBE_ROOT}/external/cJSON)
          target_link_libraries(framework_backend_probe PRIVATE ggml)
          add_executable(backend_config_args_test
            ${PROBE_ROOT}/tests/unittests/test_backend_config_args.cpp
            ${PROBE_ROOT}/app/cli/args.cpp)
          target_include_directories(backend_config_args_test PRIVATE ${PROBE_ROOT}/include ${CMAKE_CURRENT_SOURCE_DIR}/include)
          CMAKE
          cp -a external/ggml/src/ggml-hip/halo source/external/ggml/src/ggml-hip/
          mkdir -p source/tests/unittests/assets/hip_halo source/.github/tests
          cp tests/unittests/test_hip_halo_*.cu source/tests/unittests/
          cp tests/unittests/assets/hip_halo/* source/tests/unittests/assets/hip_halo/
          cp .github/tests/extract_halo_mmvq_probe.py .github/tests/hip_vmm_probe.cpp source/.github/tests/
          cp .github/tests/rocm_v2_*.py source/.github/tests/
          cp .github/tests/rocm-v2-cases.tsv source/.github/tests/
          cp source-commit.txt source/
          sha256sum .github/tests/rocm-v2-source.patch > source/patch-sha256.txt
          python3 source/.github/tests/rocm_v2_manifest.py --root source --focus "$VALIDATION_GROUP"
          python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir prepare-results --validate-only --log
          if [[ "$VALIDATION_GROUP" == complete ]]; then
            cmake -S source/external/ggml -B source/build/debug -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=17 -DGGML_HIP=OFF \
              -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_BUILD_TESTS=ON -DGGML_BUILD_EXAMPLES=OFF
            cmake --build source/build/debug --target test-backend-ops framework_backend_probe backend_config_args_test --parallel 4
            source/build/debug/bin/test-backend-ops --suite rocm-v2 --list-cases > prepare-cases.tsv
            cmp prepare-cases.tsv source/.github/tests/rocm-v2-cases.tsv
            source/build/debug/bin/framework_backend_probe --log
            source/build/debug/bin/backend_config_args_test --log
          fi
          tar -czf probe-source.tar.gz --exclude=.git --exclude=source/build source source-vulkan
          du -h probe-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: validation-inputs
          path: probe-source.tar.gz
          compression-level: 0
          retention-days: 3
  probe:
    needs: prepare
    runs-on: [self-hosted, linux, devlab-dispatch, strix-halo]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ github.workspace }}/rocm-v2-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      OMP_NUM_THREADS: 8
      CCACHE_BASEDIR: ${{ github.workspace }}/rocm-v2-${{ github.run_id }}-${{ github.run_attempt }}
      CCACHE_NOHASHDIR: true
      CCACHE_DIR: ${{ github.workspace }}/.cache/rocm-v2
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validation-inputs
          path: ${{ github.workspace }}/rocm-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare check environment
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          tar -xzf probe-source.tar.gz
          mkdir -p results
          echo "campaign_deadline=$(( $(date +%s) + 2400 ))" >> "$GITHUB_ENV"
          echo "$PWD/source/toolchain" >> "$GITHUB_PATH"
          source/toolchain/ccache --version > results/ccache.log
          {
            cat source/source-commit.txt source/patch-sha256.txt
            /opt/rocm/bin/hipcc --version
            /opt/rocm/llvm/bin/amdgpu-arch
            uname -a
          } > results/environment.log 2>&1
      - uses: actions/cache/restore@v4
        id: cache
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: rocm-v2-a5369900-gfx1151-debug-cxx17-${{ github.sha }}
          restore-keys: |
            rocm-v2-a5369900-gfx1151-debug-cxx17-
      - name: Build checks
        id: builds
        continue-on-error: true
        shell: bash
        run: |
          ulimit -c 0
          python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir results --through-suite builds --deadline-epoch "$campaign_deadline" --log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-builds
          path: ${{ github.workspace }}/rocm-v2-${{ github.run_id }}-${{ github.run_attempt }}/results/
          retention-days: 7
      - name: Run checks
        continue-on-error: true
        shell: bash
        run: |
          ulimit -c 0
          python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir results --resume --through-suite correctness --deadline-epoch "$campaign_deadline" --log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-progress
          path: ${{ github.workspace }}/rocm-v2-${{ github.run_id }}-${{ github.run_attempt }}/results/
          retention-days: 7
      - name: Run additional checks
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          ulimit -c 0
          python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir results --resume --through-suite framework --deadline-epoch "$campaign_deadline" --log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-additional
          path: ${{ github.workspace }}/rocm-v2-${{ github.run_id }}-${{ github.run_attempt }}/results/
          retention-days: 14
      - name: Finish checks
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          ulimit -c 0
          python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir results --resume --deadline-epoch "$campaign_deadline" --log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: ${{ github.workspace }}/rocm-v2-${{ github.run_id }}-${{ github.run_attempt }}/results/
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: rocm-v2-a5369900-gfx1151-debug-cxx17-${{ github.sha }}
