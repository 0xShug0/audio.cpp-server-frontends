name: Validation
run-name: Validation

on:
  workflow_dispatch:
    inputs:
      focus:
        description: Validation group
        type: choice
        options: [yue2-vulkan, asr-music, complete, sgemm, precision, submission, matrix, fused, dispatch, split, loads, integrated, refine, qwen, halo, halo-ops, halo-final, hip-baseline, halo-types, ggml-v1, irodori-main, tts-main, ar-gemv, breeze-ar, rdna-depth, tts-profile, tts-kernels, rms-probes, generic-gates, workload-probes, workload-refine]
        default: ggml-v1

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.focus == 'workload-probes' || inputs.focus == 'workload-refine') && 30 || 15 }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/tests
            tests/unittests/test_hip_halo_sgemm.cu
            tests/unittests/test_hip_halo_im2col.cu
            tests/unittests/test_hip_halo_mmvq.cu
            tests/unittests/assets/hip_halo
            external/ggml/src/ggml-hip/halo
      - name: Prepare validation inputs
        env:
          VALIDATION_GROUP: ${{ inputs.focus || 'ggml-v1' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/tests -p "test_rocm_v2_*.py" -v
          if [[ "$VALIDATION_GROUP" == yue2-vulkan ]]; then
            git init source
            git -C source remote add origin https://github.com/0xShug0/audio.cpp.git
            git -C source fetch --no-tags --depth=1 --filter=blob:none origin 41c1f8ffa0d13a1b7e366e30ea5fe5ab8d169d48
            git -C source sparse-checkout set include src app docs model_specs tools/cmake tests/perf webui/native/demo_voices external/ggml external/cJSON external/cpp-httplib external/libyaml external/llama_tokenizer external/sentencepiece external/utf8proc
            git -C source checkout --detach FETCH_HEAD
            git -C source rev-parse HEAD > source/source-commit.txt
            mkdir -p source/.github/tests
            cp .github/tests/rocm_v2_campaign.py .github/tests/yue2_vulkan_1153.py .github/tests/yue2-vulkan-1153-*.json source/.github/tests/
            python3 source/.github/tests/yue2_vulkan_1153.py --root source --prepare
            python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir prepare-results --validate-only --log
            python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          root = Path('source')
          paths = sorted(p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts)
          (root / 'main-source-sha256.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.relative_to(root).as_posix() + '\n' for p in paths))
          PYTHON
            tar -czf probe-source.tar.gz --exclude=.git source
            du -h probe-source.tar.gz
            exit 0
          fi
          if [[ "$VALIDATION_GROUP" == workload-probes || "$VALIDATION_GROUP" == workload-refine ]]; then
            extra=()
            if [[ "$VALIDATION_GROUP" == workload-refine ]]; then extra+=(--refine); fi
            python3 .github/tests/rocm_v2_workload.py --root source --prepare "${extra[@]}"
            exit 0
          fi
          if [[ "$VALIDATION_GROUP" == generic-gates ]]; then
            git init source
            git -C source remote add origin https://github.com/0xShug0/audio.cpp.git
            git -C source fetch --no-tags --depth=1 --filter=blob:none origin f7a0982a3b70da5217535ff909eb9ec3a51dc8df
            git -C source sparse-checkout set external/ggml
            git -C source checkout --detach FETCH_HEAD
            git -C source rev-parse HEAD > source/source-commit.txt
            cp -a source source-baseline
            git -C source apply --check ../.github/tests/generic-gates.patch
            git -C source apply ../.github/tests/generic-gates.patch
            cp source/external/ggml/tests/test-backend-ops.cpp source-baseline/external/ggml/tests/test-backend-ops.cpp
            mkdir -p source/.github/tests source-baseline/.github/tests source/toolchain
            cp .github/tests/rocm_v2_*.py .github/tests/hip_vmm_probe.cpp source/.github/tests/
            cp -a .github/tests/generic-gates source/.github/tests/
            cp -a .github/tests/generic-gates source-baseline/.github/tests/
            cp .github/tests/generic-gates.patch source/
            curl --fail --location --max-time 120 --retry 2 -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-musl-static.tar.xz
            tar -xJf ccache.tar.xz --strip-components=1 -C source/toolchain ccache-4.13.6-linux-x86_64-musl-static/ccache
            python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          for directory in ['source', 'source-baseline']:
              root = Path(directory)
              files = sorted((root / 'external/ggml').rglob('*'))
              files += sorted((root / '.github/tests/generic-gates').rglob('*'))
              lines = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.relative_to(root).as_posix() for p in files if p.is_file()]
              (root / 'gates-source-sha256.txt').write_text('\n'.join(lines) + '\n')
          PYTHON
            cp source/gates-source-sha256.txt source/patch-sha256.txt
            cmake -S source/external/ggml -B source/build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=17 -DBUILD_SHARED_LIBS=OFF -DGGML_HIP=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_BLAS=OFF -DGGML_BUILD_TESTS=ON -DGGML_BUILD_EXAMPLES=OFF
            cmake --build source/build/debug --target test-backend-ops --parallel 8
            source/build/debug/bin/test-backend-ops test -b CPU --test-file source/.github/tests/generic-gates/all.ops > source/cpu-preflight.log 2>&1
            tail -5 source/cpu-preflight.log
            python3 source/.github/tests/rocm_v2_halo.py --root source --generic-gates
            python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir prepare-results --validate-only --log
            tar -czf probe-source.tar.gz --exclude=.git --exclude=source/build --exclude=source-baseline/build source source-baseline
            du -h probe-source.tar.gz
            exit 0
          fi
          if [[ "$VALIDATION_GROUP" == asr-music || "$VALIDATION_GROUP" == irodori-main || "$VALIDATION_GROUP" == tts-main || "$VALIDATION_GROUP" == breeze-ar || "$VALIDATION_GROUP" == tts-profile || "$VALIDATION_GROUP" == tts-kernels || "$VALIDATION_GROUP" == rms-probes ]]; then
            git init source
            git -C source remote add origin https://github.com/0xShug0/audio.cpp.git
            source_revision=f64cfb5f2e0c9132f8d85281a4ec55d080313698
            if [[ "$VALIDATION_GROUP" == tts-main ]]; then
              source_revision=b4a45c4fa3d00c20e1db39688fd599103baa0a6b
            fi
            if [[ "$VALIDATION_GROUP" == asr-music ]]; then
              source_revision=3a0dd44293fc706f5c375ec96d3e6fd9c54b6c45
            fi
            if [[ "$VALIDATION_GROUP" == tts-profile || "$VALIDATION_GROUP" == tts-kernels || "$VALIDATION_GROUP" == rms-probes ]]; then
              source_revision=141ec6f861aa61b8a7c81f1432c77ef9c08e3522
            fi
            if [[ "$VALIDATION_GROUP" == breeze-ar ]]; then
              source_revision=482e9a1504b878eec266a5f33e8841d898d011c6
            fi
            git -C source fetch --no-tags --depth=1 --filter=blob:none origin "$source_revision"
            git -C source sparse-checkout set include src app docs model_specs tools/cmake tests/perf webui/native/demo_voices external/ggml external/cJSON external/cpp-httplib external/libyaml external/llama_tokenizer external/sentencepiece external/utf8proc
            git -C source checkout --detach FETCH_HEAD
            git -C source rev-parse HEAD > source/source-commit.txt
            if [[ "$VALIDATION_GROUP" == asr-music ]]; then
              cp -a source source-baseline
              git -C source-baseline apply --check ../.github/tests/asr-q8-baseline.patch
              git -C source-baseline apply ../.github/tests/asr-q8-baseline.patch
              git -C source apply --check ../.github/tests/asr-q8-shared.patch
              git -C source apply ../.github/tests/asr-q8-shared.patch
              cp source/external/ggml/tests/test-backend-ops.cpp source-baseline/external/ggml/tests/test-backend-ops.cpp
              for tree in source source-baseline; do
                cat >> "$tree/CMakeLists.txt" <<'CMAKE'
          add_executable(test-backend-ops external/ggml/tests/test-backend-ops.cpp)
          target_link_libraries(test-backend-ops PRIVATE ggml Threads::Threads)
          CMAKE
              done
              ln -s ../source/inputs source-baseline/inputs
            fi
            if [[ "$VALIDATION_GROUP" == tts-main ]]; then
              cat >> source/CMakeLists.txt <<'CMAKE'
          add_executable(test-backend-ops external/ggml/tests/test-backend-ops.cpp)
          target_link_libraries(test-backend-ops PRIVATE ggml Threads::Threads)
          CMAKE
            fi
            if [[ "$VALIDATION_GROUP" == tts-kernels ]]; then
              git -C source sparse-checkout add tests/unittests tests/yue2 tests/parakeet_tdt tests/moss_tts_v15
              cp -a source source-baseline
              git -C source apply --check ../.github/tests/tts-kernels.patch
              git -C source apply ../.github/tests/tts-kernels.patch
              cat >> source/CMakeLists.txt <<'CMAKE'
          add_executable(test-backend-ops external/ggml/tests/test-backend-ops.cpp)
          target_link_libraries(test-backend-ops PRIVATE ggml Threads::Threads)
          add_executable(rounding_chain_test tests/unittests/test_cuda_round_bf16_fusion.cpp)
          target_link_libraries(rounding_chain_test PRIVATE ggml Threads::Threads)
          CMAKE
            fi
            if [[ "$VALIDATION_GROUP" == rms-probes ]]; then
              git -C source sparse-checkout add tests/unittests
              git -C source apply --check ../.github/tests/tts-kernels.patch
              git -C source apply ../.github/tests/tts-kernels.patch
              cat >> source/external/ggml/CMakeLists.txt <<'CMAKE'
          find_package(Threads REQUIRED)
          add_executable(rounding_chain_test ../../tests/unittests/test_cuda_round_bf16_fusion.cpp)
          target_link_libraries(rounding_chain_test PRIVATE ggml Threads::Threads)
          CMAKE
            fi
            if [[ "$VALIDATION_GROUP" == tts-profile ]]; then
              git -C source apply --check ../.github/tests/tts-profile.patch
              git -C source apply ../.github/tests/tts-profile.patch
            fi
            mkdir -p source/.github/tests source/toolchain source/inputs
            cp .github/tests/rocm_v2_*.py .github/tests/hip_vmm_probe.cpp source/.github/tests/
            cp .github/tests/halo-model-files.json source/.github/tests/
            cp .github/tests/tts-model-files.json source/.github/tests/
            cp .github/tests/asr-music-*.json source/.github/tests/
            curl --fail --location --max-time 120 --retry 2 -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-musl-static.tar.xz
            tar -xJf ccache.tar.xz --strip-components=1 -C source/toolchain ccache-4.13.6-linux-x86_64-musl-static/ccache
            python3 - <<'PYTHON'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, '.github/tests')
          from rocm_v2_halo import model_requests
          root = Path('source')
          if os.environ['VALIDATION_GROUP'] == 'asr-music':
              from rocm_v2_halo import prepare_asr_music_inputs
              prepare_asr_music_inputs(root)
          elif os.environ['VALIDATION_GROUP'] in ['tts-main', 'breeze-ar', 'tts-profile', 'tts-kernels', 'rms-probes']:
              from rocm_v2_halo import tts_requests
              records = json.loads(Path('.github/tests/tts-model-files.json').read_text())
              if os.environ['VALIDATION_GROUP'] != 'tts-main':
                  records = [r for r in records if r['family'] != 'irodori_tts']
              if os.environ['VALIDATION_GROUP'] == 'rms-probes':
                  records = []
              if os.environ['VALIDATION_GROUP'] in ['tts-profile', 'tts-kernels']:
                  records = [r for r in records if r['family'] in ['ming3_tts', 'omnivoice']]
              if os.environ['VALIDATION_GROUP'] == 'breeze-ar':
                  records = [r for r in records if r['family'] == 'breeze_tts']
              hashes = [r['sha256'] + '  ' + r['destination'] for r in records]
              for family, sequence in tts_requests().items():
                  if family == 'irodori_tts' and os.environ['VALIDATION_GROUP'] != 'tts-main':
                      continue
                  if os.environ['VALIDATION_GROUP'] in ['tts-profile', 'tts-kernels'] and family not in ['ming3_tts', 'omnivoice']:
                      continue
                  if os.environ['VALIDATION_GROUP'] == 'breeze-ar' and family != 'breeze_tts':
                      continue
                  if os.environ['VALIDATION_GROUP'] == 'tts-kernels' and family == 'ming3_tts':
                      sequence[0]['text'] = next(r['text'] for r in sequence if r['id'] == 'long')
                  request = root / ('inputs/' + family + '-requests.json')
                  request.write_text(json.dumps(sequence, ensure_ascii=False, indent=2) + '\n')
                  hashes.append(hashlib.sha256(request.read_bytes()).hexdigest() + '  ' + request.relative_to(root).as_posix())
              (root / 'inputs/model-provenance.json').write_text(json.dumps(records, indent=2) + '\n')
              (root / 'inputs/input-sha256.txt').write_text('\n'.join(hashes) + '\n')
          else:
              record = next(r for r in json.loads(Path('.github/tests/halo-model-files.json').read_text()) if r['destination'] == 'inputs/irodori.gguf')
              record = dict(record, family='irodori_tts')
              requests = root / 'inputs/irodori_tts-requests.json'
              requests.write_text(json.dumps(model_requests()['irodori_tts'], ensure_ascii=False, indent=2) + '\n')
              (root / 'inputs/model-provenance.json').write_text(json.dumps([record], indent=2))
              with requests.open('rb') as stream:
                  request_digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              (root / 'inputs/input-sha256.txt').write_text(record['sha256'] + '  inputs/irodori.gguf\n' + request_digest + '  inputs/irodori_tts-requests.json\n')
          hashes = []
          tracked = subprocess.check_output(['git', 'ls-files', '-z'], cwd=root)
          tracked += subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z', 'external/ggml'], cwd=root)
          for name in tracked.decode().split('\0'):
              file = root / name
              if name and file.is_file():
                  with file.open('rb') as stream:
                      hashes.append(hashlib.file_digest(stream, 'sha256').hexdigest() + '  ' + name)
          manifest = '\n'.join(hashes) + '\n'
          (root / 'main-source-sha256.txt').write_text(manifest)
          (root / 'patch-sha256.txt').write_text(manifest)
          PYTHON
            archive_roots=(source)
            if [[ "$VALIDATION_GROUP" == asr-music || "$VALIDATION_GROUP" == tts-kernels ]]; then
              python3 -c 'import hashlib, subprocess; from pathlib import Path; r=Path("source-baseline"); names=subprocess.check_output(["git", "ls-files", "-z"], cwd=r).decode().split("\0"); lines=[hashlib.sha256((r/n).read_bytes()).hexdigest()+"  "+n for n in names if n and (r/n).is_file()]; (r/"baseline-source-sha256.txt").write_text("\n".join(lines)+"\n")'
              archive_roots+=(source-baseline)
            fi
            if [[ "$VALIDATION_GROUP" == breeze-ar ]]; then
              git -C source fetch --no-tags --depth=1 --filter=blob:none origin f64cfb5f2e0c9132f8d85281a4ec55d080313698
              cp -a source source-baseline
              git -C source-baseline checkout --detach f64cfb5f2e0c9132f8d85281a4ec55d080313698
              git -C source-baseline rev-parse HEAD > source-baseline/source-commit.txt
              python3 -c 'import hashlib, subprocess; from pathlib import Path; r=Path("source-baseline"); names=subprocess.check_output(["git", "ls-files", "-z"], cwd=r).decode().split("\0"); lines=[hashlib.sha256((r/n).read_bytes()).hexdigest()+"  "+n for n in names if n and (r/n).is_file()]; (r/"baseline-source-sha256.txt").write_text("\n".join(lines)+"\n")'
              archive_roots+=(source-baseline)
            fi
            python3 source/.github/tests/rocm_v2_halo.py --root source --"$VALIDATION_GROUP"
            if [[ "$VALIDATION_GROUP" == tts-main ]]; then
              python3 - <<'PYTHON'
          import json
          from pathlib import Path
          path = Path('source/campaign.json')
          plan = json.loads(path.read_text())
          build = next(b for b in plan['builds'] if b['id'] == 'model')
          command = build['commands'][1]
          command.insert(command.index('--parallel'), 'test-backend-ops')
          suite = next(s for s in plan['suites'] if s['id'] == 'correctness')
          suite['timeout_s'] = 600
          for impl in ['default', 'gfx1151_v1']:
              suite['cases'].append(dict(id='ggml-' + impl, argv=[
                  'build/debug/bin/test-backend-ops', 'test', '-b', 'ROCm0',
                  '--suite', 'gfx1151_v1', '--backend-impl', impl]))
          path.write_text(json.dumps(plan, indent=2) + '\n')
          PYTHON
            fi
            python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir prepare-results --validate-only --log
            tar -czf probe-source.tar.gz --exclude=.git --exclude=source/build "${archive_roots[@]}"
            du -h probe-source.tar.gz
            exit 0
          fi
          if [[ "$VALIDATION_GROUP" == rdna-depth ]]; then
            git init source
            git -C source remote add origin https://github.com/0xShug0/audio.cpp.git
            git -C source fetch --no-tags --depth=1 --filter=blob:none origin f64cfb5f2e0c9132f8d85281a4ec55d080313698
            git -C source sparse-checkout set include src app docs model_specs tools/cmake tests/perf tests/unittests webui/native/demo_voices external/ggml external/cJSON external/cpp-httplib external/libyaml external/sentencepiece external/utf8proc external/llama_tokenizer
            git -C source checkout --detach FETCH_HEAD
            git -C source apply --index --unidiff-zero --check ../.github/tests/rdna-depth.patch
            git -C source apply --index --unidiff-zero ../.github/tests/rdna-depth.patch
            git -C source rev-parse HEAD > source/source-commit.txt
            mkdir -p source/.github/tests source/toolchain
            cp .github/tests/rocm_v2_*.py .github/tests/hip_vmm_probe.cpp source/.github/tests/
            cat >> source/CMakeLists.txt <<'CMAKE'
          add_executable(decoder_packed_projection_test tests/unittests/test_decoder_packed_projections.cpp)
          target_link_libraries(decoder_packed_projection_test PRIVATE engine_runtime ggml)
          add_executable(test-backend-ops external/ggml/tests/test-backend-ops.cpp)
          target_link_libraries(test-backend-ops PRIVATE ggml)
          CMAKE
            python3 -c 'import hashlib, subprocess; from pathlib import Path; r=Path("source"); names=subprocess.check_output(["git", "ls-files", "-z"], cwd=r).decode().split("\0"); lines=[hashlib.sha256((r/n).read_bytes()).hexdigest()+"  "+n for n in names if n and (r/n).is_file()]; (r/"depth-source-sha256.txt").write_text("\n".join(lines)+"\n")'
            cp source/depth-source-sha256.txt source/patch-sha256.txt
            curl --fail --location --max-time 120 --retry 2 -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-musl-static.tar.xz
            tar -xJf ccache.tar.xz --strip-components=1 -C source/toolchain ccache-4.13.6-linux-x86_64-musl-static/ccache
            c++ -std=c++17 -fsyntax-only -Isource/include -Isource/external/ggml/include -Isource/external/cJSON source/tests/unittests/test_decoder_packed_projections.cpp
            python3 source/.github/tests/rocm_v2_halo.py --root source --rdna-depth
            python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir prepare-results --validate-only --log
            tar -czf probe-source.tar.gz --exclude=.git --exclude=source/build source
            du -h probe-source.tar.gz
            exit 0
          fi
          if [[ "$VALIDATION_GROUP" == ar-gemv ]]; then
            git init source
            git -C source remote add origin https://github.com/0xShug0/audio.cpp.git
            git -C source fetch --no-tags --depth=1 --filter=blob:none origin f64cfb5f2e0c9132f8d85281a4ec55d080313698
            git -C source sparse-checkout set external/ggml
            git -C source checkout --detach FETCH_HEAD
            git -C source apply --check ../.github/tests/ar-gemv.patch
            git -C source apply ../.github/tests/ar-gemv.patch
            git -C source rev-parse HEAD > source/source-commit.txt
            mkdir -p source/.github/tests source/toolchain
            cp .github/tests/rocm_v2_*.py .github/tests/hip_vmm_probe.cpp source/.github/tests/
            (cd source && git ls-files -z external/ggml | xargs -0 sha256sum) > source/ar-source-sha256.txt
            cp source/ar-source-sha256.txt source/patch-sha256.txt
            curl --fail --location --max-time 120 --retry 2 -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-musl-static.tar.xz
            tar -xJf ccache.tar.xz --strip-components=1 -C source/toolchain ccache-4.13.6-linux-x86_64-musl-static/ccache
            cmake -S source/external/ggml -B source/build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=17 -DBUILD_SHARED_LIBS=OFF -DGGML_HIP=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_BLAS=OFF -DGGML_BUILD_TESTS=ON -DGGML_BUILD_EXAMPLES=OFF
            cmake --build source/build/debug --target test-backend-ops --parallel 8
            source/build/debug/bin/test-backend-ops test -b CPU --suite gfx1151_v1 -o MUL_MAT -p 'type_a=q8_0,type_b=f32,m=[0-9]+,n=(1|2),' > cpu-preflight.log 2>&1
            tail -5 cpu-preflight.log
            cp cpu-preflight.log source/
            python3 source/.github/tests/rocm_v2_halo.py --root source --ar-gemv
            python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir prepare-results --validate-only --log
            tar -czf probe-source.tar.gz --exclude=.git --exclude=source/build source
            du -h probe-source.tar.gz
            exit 0
          fi
          if [[ "$VALIDATION_GROUP" == ggml-v1 ]]; then
            git init source
            git -C source remote add origin https://github.com/0xShug0/audio.cpp.git
            git -C source fetch --no-tags --depth=1 --filter=blob:none origin ef329fb5f852fe26da14599b25c89a73a0e568f5
            git -C source sparse-checkout set external/ggml
            git -C source checkout --detach FETCH_HEAD
            git -C source rev-parse HEAD > source/source-commit.txt
            mkdir -p source/.github/tests source/toolchain
            cp .github/tests/rocm_v2_*.py .github/tests/hip_vmm_probe.cpp source/.github/tests/
            (cd source && git ls-files -z external/ggml | xargs -0 sha256sum) > source/ggml-source-sha256.txt
            cp source/ggml-source-sha256.txt source/patch-sha256.txt
            curl --fail --location --max-time 120 --retry 2 -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-musl-static.tar.xz
            tar -xJf ccache.tar.xz --strip-components=1 -C source/toolchain ccache-4.13.6-linux-x86_64-musl-static/ccache
            cmake -S source/external/ggml -B source/build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=17 -DGGML_HIP=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_BLAS=OFF -DGGML_BUILD_TESTS=ON -DGGML_BUILD_EXAMPLES=OFF
            cmake --build source/build/debug --target test-backend-ops --parallel 8
