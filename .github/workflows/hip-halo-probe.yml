name: Validation
run-name: Validation

on:
  workflow_dispatch:
    inputs:
      focus:
        description: Validation group
        type: choice
        options: [complete, sgemm, precision, submission, matrix, fused, dispatch, split, loads, integrated, refine, qwen, halo, halo-ops, halo-final, hip-baseline, halo-types, ggml-v1, irodori-main, tts-main, ar-gemv, breeze-ar]
        default: ggml-v1
  push:
    branches: [experiment/rocm-v2-probes]
    paths:
      - .github/workflows/hip-halo-probe.yml
      - .github/tests/rocm_v2_*
      - .github/tests/rocm-v2-*

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/tests
            tests/unittests/test_hip_halo_sgemm.cu
            tests/unittests/test_hip_halo_im2col.cu
            tests/unittests/test_hip_halo_mmvq.cu
            tests/unittests/assets/hip_halo
            external/ggml/src/ggml-hip/halo
      - name: Prepare validation inputs
        env:
          VALIDATION_GROUP: ${{ inputs.focus || 'ggml-v1' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/tests -p "test_rocm_v2_*.py" -v
          if [[ "$VALIDATION_GROUP" == irodori-main || "$VALIDATION_GROUP" == tts-main || "$VALIDATION_GROUP" == breeze-ar ]]; then
            git init source
            git -C source remote add origin https://github.com/0xShug0/audio.cpp.git
            source_revision=46e3893bec3be00f24e8db742ec4a03283a53746
            if [[ "$VALIDATION_GROUP" == tts-main ]]; then
              source_revision=67c7c4dff00d4d5355f93fd1713eac6f5c02aaa5
            fi
            if [[ "$VALIDATION_GROUP" == breeze-ar ]]; then
              source_revision=56baca3d6b2ef7bd22cde27fcad08e1d6610d16a
            fi
            git -C source fetch --no-tags --depth=1 --filter=blob:none origin "$source_revision"
            git -C source sparse-checkout set include src app docs model_specs tools/cmake tests/perf webui/native/demo_voices external/ggml external/cJSON external/cpp-httplib external/libyaml external/llama_tokenizer external/sentencepiece external/utf8proc
            git -C source checkout --detach FETCH_HEAD
            git -C source rev-parse HEAD > source/source-commit.txt
            mkdir -p source/.github/tests source/toolchain source/inputs
            cp .github/tests/rocm_v2_*.py .github/tests/hip_vmm_probe.cpp source/.github/tests/
            cp .github/tests/halo-model-files.json source/.github/tests/
            cp .github/tests/tts-model-files.json source/.github/tests/
            curl --fail --location --max-time 120 --retry 2 -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-musl-static.tar.xz
            tar -xJf ccache.tar.xz --strip-components=1 -C source/toolchain ccache-4.13.6-linux-x86_64-musl-static/ccache
            python3 - <<'PYTHON'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, '.github/tests')
          from rocm_v2_halo import model_requests
          root = Path('source')
          if os.environ['VALIDATION_GROUP'] in ['tts-main', 'breeze-ar']:
              from rocm_v2_halo import tts_requests
              records = json.loads(Path('.github/tests/tts-model-files.json').read_text())
              if os.environ['VALIDATION_GROUP'] == 'breeze-ar':
                  records = [r for r in records if r['family'] == 'breeze_tts']
              hashes = [r['sha256'] + '  ' + r['destination'] for r in records]
              for family, sequence in tts_requests().items():
                  if os.environ['VALIDATION_GROUP'] == 'breeze-ar' and family != 'breeze_tts':
                      continue
                  request = root / ('inputs/' + family + '-requests.json')
                  request.write_text(json.dumps(sequence, ensure_ascii=False, indent=2) + '\n')
                  hashes.append(hashlib.sha256(request.read_bytes()).hexdigest() + '  ' + request.relative_to(root).as_posix())
              (root / 'inputs/model-provenance.json').write_text(json.dumps(records, indent=2) + '\n')
              (root / 'inputs/input-sha256.txt').write_text('\n'.join(hashes) + '\n')
          else:
              record = next(r for r in json.loads(Path('.github/tests/halo-model-files.json').read_text()) if r['destination'] == 'inputs/irodori.gguf')
              target = root / record['destination']
              url = 'https://huggingface.co/{repo}/resolve/{revision}/{file}?download=true'.format(**record)
              subprocess.run(['curl', '--fail', '--location', '--connect-timeout', '20', '--max-time', '600', '--retry', '2', '-o', str(target), url], check=True)
              with target.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              assert digest == record['sha256'] and target.stat().st_size == record['size'], 'model integrity mismatch'
              requests = root / 'inputs/irodori_tts-requests.json'
              requests.write_text(json.dumps(model_requests()['irodori_tts'], ensure_ascii=False, indent=2) + '\n')
              (root / 'inputs/model-provenance.json').write_text(json.dumps([record], indent=2))
              with requests.open('rb') as stream:
                  request_digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              (root / 'inputs/input-sha256.txt').write_text(digest + '  inputs/irodori.gguf\n' + request_digest + '  inputs/irodori_tts-requests.json\n')
          hashes = []
          for name in subprocess.check_output(['git', 'ls-files', '-z'], cwd=root).decode().split('\0'):
              file = root / name
              if name and file.is_file():
                  with file.open('rb') as stream:
                      hashes.append(hashlib.file_digest(stream, 'sha256').hexdigest() + '  ' + name)
          manifest = '\n'.join(hashes) + '\n'
          (root / 'main-source-sha256.txt').write_text(manifest)
          (root / 'patch-sha256.txt').write_text(manifest)
          PYTHON
            archive_roots=(source)
            if [[ "$VALIDATION_GROUP" == breeze-ar ]]; then
              git -C source fetch --no-tags --depth=1 --filter=blob:none origin f64cfb5f2e0c9132f8d85281a4ec55d080313698
              cp -a source source-baseline
              git -C source-baseline checkout --detach f64cfb5f2e0c9132f8d85281a4ec55d080313698
              git -C source-baseline rev-parse HEAD > source-baseline/source-commit.txt
              python3 -c 'import hashlib, subprocess; from pathlib import Path; r=Path("source-baseline"); names=subprocess.check_output(["git", "ls-files", "-z"], cwd=r).decode().split("\0"); lines=[hashlib.sha256((r/n).read_bytes()).hexdigest()+"  "+n for n in names if n and (r/n).is_file()]; (r/"baseline-source-sha256.txt").write_text("\n".join(lines)+"\n")'
              archive_roots+=(source-baseline)
            fi
            python3 source/.github/tests/rocm_v2_halo.py --root source --"$VALIDATION_GROUP"
            python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir prepare-results --validate-only --log
            tar -czf probe-source.tar.gz --exclude=.git --exclude=source/build "${archive_roots[@]}"
            du -h probe-source.tar.gz
            exit 0
          fi
          if [[ "$VALIDATION_GROUP" == ar-gemv ]]; then
            git init source
            git -C source remote add origin https://github.com/0xShug0/audio.cpp.git
            git -C source fetch --no-tags --depth=1 --filter=blob:none origin f64cfb5f2e0c9132f8d85281a4ec55d080313698
            git -C source sparse-checkout set external/ggml
            git -C source checkout --detach FETCH_HEAD
            git -C source apply --check ../.github/tests/ar-gemv.patch
            git -C source apply ../.github/tests/ar-gemv.patch
            git -C source rev-parse HEAD > source/source-commit.txt
            mkdir -p source/.github/tests source/toolchain
            cp .github/tests/rocm_v2_*.py .github/tests/hip_vmm_probe.cpp source/.github/tests/
            (cd source && git ls-files -z external/ggml | xargs -0 sha256sum) > source/ar-source-sha256.txt
            cp source/ar-source-sha256.txt source/patch-sha256.txt
            curl --fail --location --max-time 120 --retry 2 -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-musl-static.tar.xz
            tar -xJf ccache.tar.xz --strip-components=1 -C source/toolchain ccache-4.13.6-linux-x86_64-musl-static/ccache
            cmake -S source/external/ggml -B source/build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=17 -DBUILD_SHARED_LIBS=OFF -DGGML_HIP=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_BLAS=OFF -DGGML_BUILD_TESTS=ON -DGGML_BUILD_EXAMPLES=OFF
            cmake --build source/build/debug --target test-backend-ops --parallel 8
            source/build/debug/bin/test-backend-ops test -b CPU --suite gfx1151_v1 -o MUL_MAT -p 'type_a=q8_0,type_b=f32,m=[0-9]+,n=(1|2),' > cpu-preflight.log 2>&1
            tail -5 cpu-preflight.log
            cp cpu-preflight.log source/
            python3 source/.github/tests/rocm_v2_halo.py --root source --ar-gemv
            python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir prepare-results --validate-only --log
            tar -czf probe-source.tar.gz --exclude=.git --exclude=source/build source
            du -h probe-source.tar.gz
            exit 0
          fi
          if [[ "$VALIDATION_GROUP" == ggml-v1 ]]; then
            git init source
            git -C source remote add origin https://github.com/0xShug0/audio.cpp.git
            git -C source fetch --no-tags --depth=1 --filter=blob:none origin ef329fb5f852fe26da14599b25c89a73a0e568f5
            git -C source sparse-checkout set external/ggml
            git -C source checkout --detach FETCH_HEAD
            git -C source rev-parse HEAD > source/source-commit.txt
            mkdir -p source/.github/tests source/toolchain
            cp .github/tests/rocm_v2_*.py .github/tests/hip_vmm_probe.cpp source/.github/tests/
            (cd source && git ls-files -z external/ggml | xargs -0 sha256sum) > source/ggml-source-sha256.txt
            cp source/ggml-source-sha256.txt source/patch-sha256.txt
            curl --fail --location --max-time 120 --retry 2 -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-musl-static.tar.xz
            tar -xJf ccache.tar.xz --strip-components=1 -C source/toolchain ccache-4.13.6-linux-x86_64-musl-static/ccache
            cmake -S source/external/ggml -B source/build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=17 -DGGML_HIP=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_BLAS=OFF -DGGML_BUILD_TESTS=ON -DGGML_BUILD_EXAMPLES=OFF
            cmake --build source/build/debug --target test-backend-ops --parallel 8
            source/build/debug/bin/test-backend-ops test -b CPU --suite gfx1151_v1 -o MUL_MAT -p 'type_a=(f16|bf16)' > cpu-preflight.log 2>&1
            tail -5 cpu-preflight.log
            cp cpu-preflight.log source/
            python3 source/.github/tests/rocm_v2_halo.py --root source --ggml-v1
            python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir prepare-results --validate-only --log
            tar -czf probe-source.tar.gz --exclude=.git --exclude=source/build source
            du -h probe-source.tar.gz
            exit 0
          fi
          if [[ "$VALIDATION_GROUP" == halo-types ]]; then
            git init source
            git -C source remote add origin https://github.com/0xShug0/audio.cpp.git
            git -C source fetch --no-tags --depth=1 --filter=blob:none origin 2597b300f5961999387c84c65f2e8e79c088a571
            git -C source sparse-checkout set external/ggml
            git -C source checkout --detach FETCH_HEAD
            git -C source apply --include='external/ggml/**' --check ../.github/tests/halo-copy.patch
            git -C source apply --include='external/ggml/**' ../.github/tests/halo-copy.patch
            cp -a .github/tests/halo-types/external source/
            mkdir -p source/.github/tests source/toolchain
            cp .github/tests/rocm_v2_*.py .github/tests/hip_vmm_probe.cpp source/.github/tests/
            cp .github/tests/halo-types/sha256.txt source/typed-source-sha256.txt
            (cd source && sha256sum --check typed-source-sha256.txt)
            git -C source rev-parse HEAD > source/source-commit.txt
            sha256sum .github/tests/halo-copy.patch > source/patch-sha256.txt
            curl --fail --location --max-time 120 --retry 2 -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-musl-static.tar.xz
            tar -xJf ccache.tar.xz --strip-components=1 -C source/toolchain ccache-4.13.6-linux-x86_64-musl-static/ccache
            cmake -S source/external/ggml -B source/build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=17 -DGGML_HIP=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_BLAS=OFF -DGGML_BUILD_TESTS=ON -DGGML_BUILD_EXAMPLES=OFF
            cmake --build source/build/debug --target test-backend-ops --parallel 8
            source/build/debug/bin/test-backend-ops test -b CPU --suite halo -o MUL_MAT -p 'type_a=(f16|bf16)' > cpu-preflight.log 2>&1
            tail -5 cpu-preflight.log
            cp cpu-preflight.log source/
            python3 source/.github/tests/rocm_v2_halo.py --root source --typed
            python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir prepare-results --validate-only --log
            tar -czf probe-source.tar.gz --exclude=.git --exclude=source/build source
            du -h probe-source.tar.gz
            exit 0
          fi
          if [[ "$VALIDATION_GROUP" == hip-baseline ]]; then
            mkdir -p source/.github/tests
            cp .github/tests/rocm_v2_*.py .github/tests/halo-hip-baseline.patch .github/tests/halo-hip-baseline-sha256.txt source/.github/tests/
            python3 source/.github/tests/rocm_v2_halo.py --root source --hip-baseline
            python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir prepare-results --validate-only --log
            tar -czf probe-source.tar.gz source
            du -h probe-source.tar.gz
            exit 0
          fi
          mkdir -p source/toolchain
          curl --fail --location --max-time 120 --retry 2 \
            -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-musl-static.tar.xz
          tar -xJf ccache.tar.xz --strip-components=1 -C source/toolchain \
            ccache-4.13.6-linux-x86_64-musl-static/ccache
          source/toolchain/ccache --version
          sha256sum source/toolchain/ccache > source/ccache-sha256.txt
          if [[ "$VALIDATION_GROUP" == halo || "$VALIDATION_GROUP" == halo-ops || "$VALIDATION_GROUP" == halo-final ]]; then
            git init source
            git -C source remote add origin https://github.com/0xShug0/audio.cpp.git
            git -C source config core.autocrlf false
            git -C source fetch --no-tags --depth=1 --filter=blob:none origin 2597b300f5961999387c84c65f2e8e79c088a571
            git -C source sparse-checkout set include src app docs model_specs tools/cmake tests/unittests tests/perf tests/qwen3_tts tests/zipvoice webui/native/demo_voices external/ggml external/cJSON external/cpp-httplib external/libyaml external/llama_tokenizer external/sentencepiece external/utf8proc
            git -C source checkout --detach FETCH_HEAD
            git -C source rev-parse HEAD > source/source-commit.txt
            git -C source apply --check ../.github/tests/halo-source.patch
            git -C source apply ../.github/tests/halo-source.patch
            sha256sum .github/tests/halo-source.patch > source/patch-sha256.txt
            mkdir -p source/.github/tests
            cp .github/tests/rocm_v2_*.py .github/tests/hip_vmm_probe.cpp source/.github/tests/
            if [[ "$VALIDATION_GROUP" == halo-ops ]]; then
              python3 source/.github/tests/rocm_v2_halo.py --root source --operators
            elif [[ "$VALIDATION_GROUP" == halo-final ]]; then
              cp .github/tests/halo-model-files.json .github/tests/halo-baseline.patch .github/tests/halo-copy.patch .github/tests/halo-source.patch source/.github/tests/
              cp -a source source-baseline
              cp -a source source-copy
              git -C source-copy apply --reverse ../.github/tests/halo-source.patch
              git -C source-copy apply ../.github/tests/halo-copy.patch
              git -C source-baseline apply --reverse ../.github/tests/halo-source.patch
              git -C source-baseline apply ../.github/tests/halo-baseline.patch
              sha256sum .github/tests/halo-source.patch .github/tests/halo-baseline.patch .github/tests/halo-copy.patch > source/patch-sha256.txt
              cat >> source/CMakeLists.txt <<'CMAKE'
          add_executable(halo_backend_ops external/ggml/tests/test-backend-ops.cpp)
          target_link_libraries(halo_backend_ops PRIVATE ggml Threads::Threads)
          CMAKE
              python3 source/.github/tests/rocm_v2_halo.py --root source --prepare-models
              python3 source/.github/tests/rocm_v2_halo.py --root source --followup
            else
            python3 .github/tests/rocm_v2_qwen.py --prepare source
            cat >> source/CMakeLists.txt <<'CMAKE'
          add_executable(halo_backend_ops external/ggml/tests/test-backend-ops.cpp)
          target_link_libraries(halo_backend_ops PRIVATE ggml Threads::Threads)
          add_executable(halo_backend_selection tests/unittests/test_backend_device_resolution.cpp)
          target_include_directories(halo_backend_selection PRIVATE tests/unittests)
          target_link_libraries(halo_backend_selection PRIVATE engine_runtime ggml)
          CMAKE
            python3 source/.github/tests/rocm_v2_halo.py --root source
            fi
            python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir prepare-results --validate-only --log
          else
          git init source
          git -C source remote add origin https://github.com/0xShug0/audio.cpp.git
          git -C source config core.autocrlf false
          git -C source fetch --no-tags --depth=1 --filter=blob:none origin a53699007eee6616f4bc33c0ae2b1f069dac49c0
          git -C source sparse-checkout set external/ggml external/cJSON include src/framework/core src/framework/io app/cli tests/unittests
          git -C source checkout --detach FETCH_HEAD
          git -C source rev-parse HEAD > source-commit.txt
          git -C source apply --check ../.github/tests/rocm-v2-source.patch
          git -C source apply ../.github/tests/rocm-v2-source.patch
          git -C source apply --check ../.github/tests/rocm-v2-framework.patch
          git -C source apply ../.github/tests/rocm-v2-framework.patch
          if [[ "$VALIDATION_GROUP" == qwen ]]; then
            git -C source sparse-checkout set include src app docs model_specs tools/cmake tests/unittests tests/perf tests/qwen3_tts tests/zipvoice webui/native/demo_voices external/ggml external/cJSON external/cpp-httplib external/libyaml external/llama_tokenizer external/sentencepiece external/utf8proc
            git -C source apply --check ../.github/tests/rocm-v2-model.patch
            git -C source apply ../.github/tests/rocm-v2-model.patch
            python3 .github/tests/rocm_v2_qwen.py --prepare source
          fi
          cp -a source/external/ggml source-vulkan
          cat >> source/external/ggml/CMakeLists.txt <<'CMAKE'
          set(PROBE_ROOT "${CMAKE_CURRENT_SOURCE_DIR}/../..")
          add_executable(framework_backend_probe
            ${PROBE_ROOT}/tests/unittests/test_backend_device_resolution.cpp
            ${PROBE_ROOT}/src/framework/core/backend.cpp
            ${PROBE_ROOT}/src/framework/core/module.cpp
            ${PROBE_ROOT}/src/framework/core/execution_context.cpp
            ${PROBE_ROOT}/src/framework/core/host_memory.cpp
            ${PROBE_ROOT}/src/framework/io/json.cpp
            ${PROBE_ROOT}/src/framework/io/filesystem.cpp
            ${PROBE_ROOT}/external/cJSON/cJSON.c)
          target_include_directories(framework_backend_probe PRIVATE ${PROBE_ROOT}/include ${PROBE_ROOT}/external/cJSON)
          target_link_libraries(framework_backend_probe PRIVATE ggml)
          add_executable(backend_config_args_test
            ${PROBE_ROOT}/tests/unittests/test_backend_config_args.cpp
            ${PROBE_ROOT}/app/cli/args.cpp)
          target_include_directories(backend_config_args_test PRIVATE ${PROBE_ROOT}/include ${CMAKE_CURRENT_SOURCE_DIR}/include)
          CMAKE
          cp -a external/ggml/src/ggml-hip/halo source/external/ggml/src/ggml-hip/
          mkdir -p source/tests/unittests/assets/hip_halo source/.github/tests
          cp tests/unittests/test_hip_halo_*.cu source/tests/unittests/
          cp tests/unittests/assets/hip_halo/* source/tests/unittests/assets/hip_halo/
          cp .github/tests/extract_halo_mmvq_probe.py .github/tests/hip_vmm_probe.cpp source/.github/tests/
          cp .github/tests/rocm_v2_*.py source/.github/tests/
          cp .github/tests/rocm-v2-cases.tsv source/.github/tests/
          cp source-commit.txt source/
          sha256sum .github/tests/rocm-v2-source.patch .github/tests/rocm-v2-framework.patch .github/tests/rocm-v2-model.patch > source/patch-sha256.txt
          python3 source/.github/tests/rocm_v2_manifest.py --root source --focus "$VALIDATION_GROUP"
          python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir prepare-results --validate-only --log
          if [[ "$VALIDATION_GROUP" == complete ]]; then
            cmake -S source/external/ggml -B source/build/debug -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=17 -DGGML_HIP=OFF \
              -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_BUILD_TESTS=ON -DGGML_BUILD_EXAMPLES=OFF
            cmake --build source/build/debug --target test-backend-ops framework_backend_probe backend_config_args_test --parallel 4
            source/build/debug/bin/test-backend-ops --suite rocm-v2 --list-cases > prepare-cases.tsv
            cmp prepare-cases.tsv source/.github/tests/rocm-v2-cases.tsv
            source/build/debug/bin/framework_backend_probe --log
            source/build/debug/bin/backend_config_args_test --log
          fi
          fi
          if [[ "$VALIDATION_GROUP" == halo-final ]]; then
            tar -czf probe-source.tar.gz --exclude=.git --exclude=source/build --exclude=source-baseline/build --exclude=source-copy/build source source-baseline source-copy
          elif [[ "$VALIDATION_GROUP" == halo || "$VALIDATION_GROUP" == halo-ops ]]; then
            tar -czf probe-source.tar.gz --exclude=.git --exclude=source/build source
          else
            tar -czf probe-source.tar.gz --exclude=.git --exclude=source/build source source-vulkan
          fi
          du -h probe-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: validation-inputs
          path: probe-source.tar.gz
          compression-level: 0
          retention-days: 3
  probe:
    needs: prepare
    runs-on: [self-hosted, linux, devlab-dispatch, strix-halo]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ github.workspace }}/rocm-v2-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      VALIDATION_GROUP: ${{ inputs.focus || 'ggml-v1' }}
      OMP_NUM_THREADS: 8
      CCACHE_BASEDIR: ${{ github.workspace }}/rocm-v2-${{ github.run_id }}-${{ github.run_attempt }}
      CCACHE_NOHASHDIR: true
      CCACHE_DIR: ${{ github.workspace }}/.cache/rocm-v2
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validation-inputs
          path: ${{ github.workspace }}/rocm-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.focus == 'hip-baseline' }}
        with:
          name: validation-inputs
          run-id: 40824970260
          github-token: ${{ github.token }}
