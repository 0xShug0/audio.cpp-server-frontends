        with:
          name: validation-builds
          path: ${{ github.workspace }}/rocm-v2-${{ github.run_id }}-${{ github.run_attempt }}/results/
          retention-days: ${{ (inputs.focus == 'yue2-vulkan' || inputs.focus == 'workload-refine' || inputs.focus == 'workload-probes' || inputs.focus == 'generic-gates' || inputs.focus == 'tts-main' || inputs.focus == 'asr-music') && 1 || 7 }}
      - name: Run checks
        continue-on-error: true
        shell: bash
        run: |
          ulimit -c 0
          python3 source/.github/tests/rocm_v2_campaign.py --manifest source/campaign.json --output-dir results --resume --through-suite correctness --deadline-epoch "$campaign_deadline" --log
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.focus != 'yue2-vulkan' }}
