          retention-days: ${{ (inputs.focus == 'yue2-vulkan' || inputs.focus == 'workload-refine' || inputs.focus == 'workload-probes' || inputs.focus == 'generic-gates' || inputs.focus == 'tts-main' || inputs.focus == 'asr-music') && 1 || 14 }}
