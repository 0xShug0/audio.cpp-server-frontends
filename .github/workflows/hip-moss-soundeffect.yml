name: MOSS SoundEffect Q8 HIP fusion A-B
on:
  push:
    branches: [hip-test]
    paths:
      - .github/workflows/hip-moss-soundeffect.yml
      - .github/tests/moss-hip-fusions.patch
      - .github/tests/moss-hip-requests.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generation:
    runs-on: [self-hosted, linux, devlab-dispatch, strix-halo]
    timeout-minutes: 45
    env:
      SOURCE_REF: 92550bc3b9de6f180689facb25216726940cfdff
      MODEL_REF: 73ce4162f6cce370dd533c6782b772135c1b2a8e
      GIT_LFS_SKIP_SMUDGE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Sparse checkout pinned audio.cpp without frontends
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p results source models
          curl -fLsS --retry 2 --max-time 60 -o results/source.sparse \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/.github/tests/hip-upload-pr1070.sparse"
          printf '\n/tests/\n' >> results/source.sparse
          {
            git init source
            git -C source remote add origin https://github.com/0xShug0/audio.cpp.git
            git -C source config http.version HTTP/1.1
            git -C source config remote.origin.promisor true
            git -C source config remote.origin.partialclonefilter blob:none
            timeout 180 git -C source -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$SOURCE_REF"
            git -C source sparse-checkout set --no-cone --stdin < results/source.sparse
            timeout 600 git -C source checkout --detach FETCH_HEAD
            test "$(git -C source rev-parse HEAD)" = "$SOURCE_REF"
          } 2>&1 | tee results/source-download.log
          curl -fLsS --retry 2 --max-time 900 -o models/moss-soundeffect-v2-q8_0.gguf \
            "https://huggingface.co/audio-cpp/audio.cpp-gguf/resolve/$MODEL_REF/MOSS-SoundEffect-v2-GGUF/moss-soundeffect-v2-q8_0.gguf"
          printf 'source=%s\nmodel=%s\n' "$SOURCE_REF" "$MODEL_REF" > results/revisions.txt
          curl -fLsS --retry 2 --max-time 60 -o results/hip-fusions.patch \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/.github/tests/moss-hip-fusions.patch"
          git -C source apply --check "$PWD/results/hip-fusions.patch"
          git -C source apply "$PWD/results/hip-fusions.patch"
          git -C source diff --check
          curl -fLsS --retry 2 --max-time 60 -o results/requests.json \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/.github/tests/moss-hip-requests.json"
      - name: Build Debug HIP CLI with MOSS only
        id: build
        run: |
          set -euo pipefail
          ulimit -c 0
          rocm="${ROCM_PATH:-/opt/rocm}"
          if [[ ! -x "$rocm/bin/hipcc" ]] && command -v hipconfig >/dev/null; then rocm="$(hipconfig --path)"; fi
          "$rocm/bin/hipcc" --version | tee results/environment.log
          arch=$("$rocm/llvm/bin/amdgpu-arch" | head -1)
          printf 'arch=%s\n' "$arch" | tee -a results/environment.log
          lscpu >> results/environment.log
          cmake -S source -B source/build/debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="$rocm/llvm/bin/clang" \
            -DCMAKE_CXX_COMPILER="$rocm/llvm/bin/clang++" \
            -DCMAKE_HIP_COMPILER="$rocm/llvm/bin/clang++" \
            -DCMAKE_PREFIX_PATH="$rocm" -DGPU_TARGETS="$arch" \
            -DENGINE_ENABLE_HIP=ON -DENGINE_ENABLE_CUDA=OFF \
            -DENGINE_ENABLE_METAL=OFF -DENGINE_ENABLE_VULKAN=OFF \
            -DENGINE_ENABLE_OPENMP=OFF -DGGML_OPENMP=OFF \
            -DAUDIOCPP_MODEL_SET=custom -DAUDIOCPP_MODELS=moss_soundeffect \
            -DENGINE_BUILD_TESTS=ON -DENGINE_BUILD_EXTENDED_TESTS=OFF \
            -DENGINE_BUILD_MODEL_TESTS=OFF -DAUDIOCPP_BUILD_C_API=OFF \
            -DAUDIOCPP_BUILD_NATIVE_MODEL_MANAGER=OFF -DAUDIOCPP_BUILD_SERVER_FRONTENDS=OFF \
            2>&1 | tee results/configure.log
          cmake --build source/build/debug --target audiocpp_cli device_denoiser_runtime_test --parallel 16 \
            2>&1 | tee results/build.log
      - name: Fusion correctness on HIP
        id: correctness
        continue-on-error: true
        run: |
          set -euo pipefail
          ulimit -c 0
          timeout 180 source/build/debug/bin/device_denoiser_runtime_test \
            --log results/unit-framework.log --backend hip \
            > results/unit.log 2>&1
      - name: Warmed fusion off-on-on-off requests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -uo pipefail
          ulimit -c 0
          failed=0
          for block in off-1 on-1 on-2 off-2; do
            enabled=true
            if [[ "$block" == off-* ]]; then enabled=false; fi
            mkdir -p "results/$block"
            /usr/bin/time -v timeout 1200 source/build/debug/bin/audiocpp_cli \
              --model "$PWD/models/moss-soundeffect-v2-q8_0.gguf" \
              --model-spec-override "$PWD/source/model_specs/moss_soundeffect.json" \
              --family moss_soundeffect --task gen --backend hip --threads 8 \
              --session-option "moss_soundeffect.fused_epilogues=$enabled" \
              --request-sequence "$PWD/results/requests.json" \
              --out-dir "results/$block" --metrics \
              --log --log-file "results/$block/framework.log" \
              > "results/$block/generation.log" 2>&1
            status=$?
            printf '%s\n' "$status" > "results/$block/exit-code.txt"
            if [[ "$status" != 0 ]]; then failed=1; fi
          done
          exit "$failed"
      - name: Preserve correctness failure after collecting all blocks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: test '${{ steps.correctness.outcome }}' = success
      - name: Upload logs and WAV outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moss-soundeffect-q8-hip
          path: results/
          retention-days: 1
